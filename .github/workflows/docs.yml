# Builds the documentation site (mkdocs.yml, docs/) and pushes it to the gh-pages branch.
# Repository settings: Pages -> Source: Deploy from a branch -> gh-pages / (root).
# (The "GitHub Actions" source got stuck in "updating_pages" on the first deployment;
#  publishing from a branch is GitHub's older, independent path.)
name: docs

on:
  push:
    branches: [main, test-0.6.0]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: write        # to push the built site to gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict           # fails on broken links and missing images
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true                 # the branch holds only the latest site
