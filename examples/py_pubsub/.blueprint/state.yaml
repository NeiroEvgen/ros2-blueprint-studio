          \ {msg.data}')\n        self.i += 1\n\n\ndef main():\n    rclpy.init()\n\
          \    node = Talker()\n    try:\n        rclpy.spin(node)\n    except KeyboardInterrupt:\n\
          \        pass\n    node.destroy_node()\n    rclpy.shutdown()\n\n\nif __name__\
          \ == '__main__':\n    main()\n"
