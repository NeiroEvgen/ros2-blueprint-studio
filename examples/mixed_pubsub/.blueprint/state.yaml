        code_content: "import rclpy\nfrom rclpy.node import Node\nfrom std_msgs.msg\
          \ import String\n\n\nclass Talker(Node):\n    def __init__(self):\n    \
          \    super().__init__('talker')\n        self.pub = self.create_publisher(String,\
          \ '/chatter', 10)\n        self.i = 0\n        self.create_timer(1.0, self.tick)\n\
          \n    def tick(self):\n        msg = String()\n        msg.data = f'Py:\
          \ {self.i}'\n        self.pub.publish(msg)\n        self.get_logger().info(f'Published:\
          \ {msg.data}')\n        self.i += 1\n\n\ndef main():\n    rclpy.init()\n\
          \    node = Talker()\n    try:\n        rclpy.spin(node)\n    except KeyboardInterrupt:\n\
          \        pass\n    node.destroy_node()\n    rclpy.shutdown()\n\n\nif __name__\
          \ == '__main__':\n    main()\n"
