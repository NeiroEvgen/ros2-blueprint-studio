version: '3'
services:
  cpp_pubsub_node:
    image: osrf/ros:humble-desktop
    volumes:
      - ./:/ros2_ws/src/cpp_pubsub
    working_dir: /ros2_ws
    command: bash -c "colcon build && source install/setup.bash && ros2 launch cpp_pubsub deployment.launch.py"
    network_mode: host
    privileged: true
